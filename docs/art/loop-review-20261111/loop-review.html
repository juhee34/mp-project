<!doctype html><meta charset="utf-8"><title>배경 반복 접합 검수</title><style>body{background:#f7f0e4;color:#40382d;font:16px system-ui;margin:24px}canvas{width:100%;max-width:1200px;background:#ddd;image-rendering:pixelated}button,select,input{font:inherit;margin:8px;padding:6px}p{max-width:1000px}</style><p><strong>과거 집→길→집 비교 자료입니다. 최종 게임은 집 최초 1회 뒤 길만 반복합니다.</strong></p><h1>배경 반복 접합 검수</h1><p>최신 첨부본 기준 · 아트 검수용, 실제 게임 아님 · 아직 반복 사용 불합격. 분홍 선은 접합 위치. 원본과 연결의 가로 배율을 맞추고 하단을 정렬한다. 바닥 기준선 최종 정렬은 별도 확인 필요.</p><select id="who"></select><button id="play">재생</button><button id="first">원본 → 연결</button><button id="second">연결 → 원본</button><label>속도<input id="speed" type="range" min="20" max="400" value="100"></label><label><input id="guides" type="checkbox" checked>경계 표시</label><p id="status"></p><canvas id="screen" width="1100" height="420"></canvas><p>속도는 검수 화면 px/초이며 게임 속도와 동일하지 않다. 화면을 클릭하면 멈춘다. 배경은 원본 → 연결 → 원본 순서로 반복한다.</p><script>const rows=[{"normalizedSourceHeight": 301, "sourceRect": [0, 4, 2169, 319], "id": "mint", "pair": "mint-cheese", "connectorRect": [0, 4, 2048, 299], "loopReady": false, "comparisonScale": 0.9442139234670355, "cropStatus": "review_only"}, {"normalizedSourceHeight": 364, "sourceRect": [0, 336, 2169, 385], "id": "cheese", "pair": "mint-cheese", "connectorRect": [0, 315, 2048, 364], "loopReady": false, "comparisonScale": 0.9442139234670355, "cropStatus": "review_only"}, {"normalizedSourceHeight": 332, "sourceRect": [4, 4, 2161, 352], "id": "popo", "pair": "popo-lumi", "connectorRect": [4, 4, 2040, 329], "loopReady": false, "comparisonScale": 0.944007403979639, "cropStatus": "review_only"}, {"normalizedSourceHeight": 333, "sourceRect": [4, 368, 2161, 353], "id": "lumi", "pair": "popo-lumi", "connectorRect": [4, 345, 2040, 334], "loopReady": false, "comparisonScale": 0.944007403979639, "cropStatus": "review_only"}, {"normalizedSourceHeight": 332, "sourceRect": [4, 4, 2161, 352], "id": "nunu", "pair": "nunu-piko", "connectorRect": [4, 4, 2040, 330], "loopReady": false, "comparisonScale": 0.944007403979639, "cropStatus": "review_only"}, {"normalizedSourceHeight": 333, "sourceRect": [4, 368, 2161, 353], "id": "piko", "pair": "nunu-piko", "connectorRect": [4, 346, 2040, 334], "loopReady": false, "comparisonScale": 0.944007403979639, "cropStatus": "review_only"}], urls={"mint-cheese-main": "../background-source/mint-cheese.png", "mint-cheese-connector": "../running-loop-source/mint-cheese.png", "popo-lumi-main": "../background-source/popo-lumi.png", "popo-lumi-connector": "../running-loop-source/popo-lumi.png", "nunu-piko-main": "../background-source/nunu-piko.png", "nunu-piko-connector": "../running-loop-source/nunu-piko.png"};
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d'),who=document.querySelector('#who'),play=document.querySelector('#play');
const names=['라일','치즈','포포','루미','누누','피코'];rows.forEach((r,i)=>who.add(new Option(names[i],i)));
let x=0,running=false,last=0,loaded={},cycles=0;
function params(){let r=rows[+who.value],s=r.sourceRect,n=r.connectorRect,k=n[2]/s[2];return {r,s,n,k,w:n[2],h:Math.round(s[3]*k)}}
function draw(){let {r,s,n,k,w,h}=params();ctx.clearRect(0,0,1100,420);ctx.imageSmoothingEnabled=false;let start=Math.floor(x/w);for(let j=start;j<=start+2;j++){let con=((j%2)+2)%2===1,rr=con?n:s,im=loaded[r.pair+'-'+(con?'connector':'main')],hh=con?n[3]:h,xx=j*w-x;if(im)ctx.drawImage(im,...rr,xx,420-hh,w,hh);if(document.querySelector('#guides').checked){ctx.strokeStyle='#ff00b3';ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx,420);ctx.stroke()}}document.querySelector('#status').textContent='한 바퀴 재생: '+cycles+'회 · '+names[+who.value];}
function reset(){running=false;play.textContent='재생';cycles=0;let {w}=params();x=w-550;draw()}
who.onchange=reset;play.onclick=()=>{running=!running;play.textContent=running?'정지':'재생'};canvas.onclick=()=>{running=false;play.textContent='재생'};
document.querySelector('#first').onclick=()=>{reset()};document.querySelector('#second').onclick=()=>{reset();x=2*params().w-550;draw()};document.querySelector('#guides').onchange=draw;
function tick(t){if(last&&running){let w=params().w;x+=Math.min((t-last)/1000,.1)*+document.querySelector('#speed').value;if(x>=2*w){x-=2*w;cycles++}draw()}last=t;requestAnimationFrame(tick)}
Promise.all(Object.entries(urls).map(([key,url])=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{loaded[key]=im;resolve()};im.onerror=reject;im.src=url}))).then(()=>{reset();requestAnimationFrame(tick)}).catch(()=>document.querySelector('#status').textContent='이미지 로드 실패');
</script>
